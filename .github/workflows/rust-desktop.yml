name: rust desktop

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_BUILD_JOBS: 4
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.92.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --version
      - name: Core and Windows access controls
        run: cargo test --locked --manifest-path client-core/Cargo.toml --features transport-test -- --test-threads=1
      - name: Official VM boundary
        run: cargo test --locked --manifest-path rust-runtime-sys/Cargo.toml --test vm_boundary -- --test-threads=1
      - name: Rust host and real executable startup
        run: cargo test --locked --manifest-path rust-client/Cargo.toml --all-targets -- --test-threads=1
      - name: Release build and package
        shell: pwsh
        run: ./build-windows.ps1
      - name: Packaged executable smoke test
        shell: pwsh
        run: |
          Set-Location dist/rove-windows-x64
          ./rove.exe run --snapshot tests/fixtures/world_snapshot.json --script examples/rust-host-smoke.luau --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rove-windows-x64
          path: dist/rove-windows-x64
          if-no-files-found: error
          retention-days: 14
